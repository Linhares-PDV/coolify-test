<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linhares PDV - Deploy Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      background: #22c55e20;
      color: #22c55e;
      border: 1px solid #22c55e40;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    .info-item {
      background: #0f172a;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 14px;
    }

    .info-item .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .info-item .value {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
    }

    .footer {
      font-size: 13px;
      color: #475569;
      border-top: 1px solid #1e293b;
      padding-top: 20px;
    }

    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="pulse"></span>
      Deploy OK
    </div>

    <h1>Linhares PDV</h1>
    <p>Deploy via Coolify funcionando corretamente. Esta página confirma que o pipeline GitHub → Coolify está operacional.</p>

    <div class="info-grid">
      <div class="info-item">
        <div class="label">Ambiente</div>
        <div class="value">Production</div>
      </div>
      <div class="info-item">
        <div class="label">Plataforma</div>
        <div class="value">Coolify</div>
      </div>
      <div class="info-item">
        <div class="label">Origem</div>
        <div class="value">GitHub</div>
      </div>
      <div class="info-item">
        <div class="label">Status</div>
        <div class="value">Online</div>
      </div>
    </div>

    <div class="footer">
      Linhares PDV &mdash; Teste de infraestrutura &mdash; v2
    </div>
  </div>
</body>
</html>
